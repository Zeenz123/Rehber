name: rehber
description: "Rehber - AI Personalized Learning Platform for Rural Communities"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Local SQLite Database & ORM
  sqflite: ^2.3.3+1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Networking & Connectivity
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Speech & Audio (Vosk Offline STT + Native Android TTS)
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/icons/
    - assets/models/
