version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rehber-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rehber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rehber-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/rehber
      JWT_SECRET: rehber-production-secret-key-change-me
      SMS_GATEWAY_PHONE_NUMBER: "+923001234567"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rehber-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
