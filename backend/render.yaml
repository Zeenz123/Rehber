services:
  - type: web
    name: rehber-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.1 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*" # Update this to your Vercel URL once deployed
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
